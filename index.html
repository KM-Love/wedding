<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kevin & Mila Wedding Invitation</title>
    <!-- 字型與樣式 -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Noto+Serif+TC:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --morandi-primary: #d4a373;
            --morandi-secondary: #8da399;
            --morandi-bg: #fdfbf7;
            --morandi-card: #ffffff;
            --morandi-text: #4a4a4a;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Noto Serif TC', serif;
            background-color: var(--morandi-bg);
            color: var(--morandi-text);
            line-height: 1.8;
        }
        /* 導航列 */
        nav {
            position: fixed;
            top: 0; left: 0; width: 100%;
            background: rgba(253, 251, 247, 0.85);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            z-index: 1000;
            border-bottom: 1px solid rgba(212, 163, 115, 0.2);
        }
        nav .logo {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.2rem;
            letter-spacing: 2px;
            color: var(--morandi-primary);
        }
        nav ul { display: flex; list-style: none; gap: 20px; }
        nav ul li a {
            text-decoration: none;
            color: var(--morandi-text);
            font-size: 0.95rem;
            transition: color 0.3s;
        }
        nav ul li a:hover { color: var(--morandi-primary); }

        /* 全螢幕封面 */
        header.hero {
            height: 100vh;
            background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), url('https://i.postimg.cc/PxVWb6kF/romantic-wedding-backgroundwedding-valentine-engagement-anniversary-theme-511010-2972.avif') no-repeat center center/cover;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: #fff;
            padding: 0 20px;
        }
        header.hero h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 3.5rem;
            margin-bottom: 10px;
            letter-spacing: 3px;
        }
        header.hero p {
            font-size: 1.2rem;
            letter-spacing: 5px;
            margin-bottom: 30px;
            text-transform: uppercase;
        }

        /* 內容區塊 */
        section {
            max-width: 800px;
            margin: 60px auto;
            padding: 40px 20px;
            background: var(--morandi-card);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.03);
        }
        h2 {
            font-family: 'Cormorant Garamond', serif;
            text-align: center;
            font-size: 2rem;
            color: var(--morandi-primary);
            margin-bottom: 30px;
            letter-spacing: 2px;
        }

        /* 倒數計時器 */
        .countdown-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }
        .countdown-box {
            background: #fff;
            padding: 15px 20px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            text-align: center;
            min-width: 75px;
            border-bottom: 3px solid var(--morandi-primary);
        }
        .countdown-box span {
            display: block;
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.8rem;
            color: var(--morandi-primary);
            font-weight: 600;
        }
        .countdown-box label {
            font-size: 0.8rem;
            color: #888;
        }

        /* 表單樣式 */
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
        }
        .form-control {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-family: 'Noto Serif TC', serif;
            font-size: 1rem;
            background: #fafafa;
        }
        .form-control:focus {
            outline: none;
            border-color: var(--morandi-primary);
            background: #fff;
        }
        button.submit-btn {
            background-color: var(--morandi-primary);
            color: white;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 6px;
            font-size: 1.1rem;
            font-family: 'Noto Serif TC', serif;
            cursor: pointer;
            transition: background 0.3s;
            letter-spacing: 2px;
        }
        button.submit-btn:hover {
            background-color: #b88a5b;
        }
        .no-wrap { white-space: nowrap; }

        /* 響應式調整 */
        @media (max-width: 600px) {
            header.hero h1 { font-size: 2.5rem; }
            nav ul { display: none; }
        }
    </style>
</head>
<body>

    <!-- 導航列 -->
    <nav>
        <div class="logo">K & M</div>
        <ul>
            <li><a href="#about">關於我們</a></li>
            <li><a href="#details">婚禮詳情</a></li>
            <li><a href="#rsvp">出席回函</a></li>
        </ul>
    </nav>

    <!-- 封面 -->
    <header class="hero">
        <p>Our Love Story</p>
        <h1>Kevin & Mila</h1>
        <div class="countdown-container" id="countdown">
            <div class="countdown-box"><span id="days">00</span><label>DAYS</label></div>
            <div class="countdown-box"><span id="hours">00</span><label>HOURS</label></div>
            <div class="countdown-box"><span id="minutes">00</span><label>MINUTES</label></div>
            <div class="countdown-box"><span id="seconds">00</span><label>SECONDS</label></div>
        </div>
    </header>

    <!-- 婚禮詳情 -->
    <section id="details">
        <h2>Wedding Details</h2>
        <p style="text-align: center; margin-bottom: 20px;">誠摯邀請您來見證我們的幸福時刻</p>
        <div style="text-align: center; line-height: 2.2;">
            <p><strong>📅 日期：</strong><span class="no-wrap">2027 年 1 月 31 日（星期日）</span></p>
            <p><strong>⏰ 時間：</strong><span class="no-wrap">中午 12:00 入席</span></p>
            <p><strong>📍 地點：</strong><span class="no-wrap">新莊典華 亞瑟廳</span></p>
            <p><strong>🏠 地址：</strong><span class="no-wrap">新北市新莊區幸福路</span></p>
        </div>
    </section>

    <!-- 出席回函表單 -->
    <section id="rsvp">
        <h2>RSVP 回函</h2>
        <!-- 隱藏式 iframe 防止跳轉頁面 -->
        <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;" onload="if(submitted){alert('感謝您的回覆，已成功送出！'); location.reload();}"></iframe>
        
        <form action="https://docs.google.com/forms/d/e/1FAIpQLSdneWOj9jStPRCa2OJKyux9P3ie7vWbKvJxX63rwo4vch0A-w/formResponse" method="POST" target="hidden_iframe" onsubmit="submitted=true;">
            
            <div class="form-group">
                <label>姓名 NAME</label>
                <input type="text" class="form-control" name="entry.123456789" required placeholder="請輸入您的大名">
            </div>

            <div class="form-group">
                <label>信箱 EMAIL</label>
                <input type="email" class="form-control" name="entry.987654321" placeholder="請輸入電子信箱（選填）">
            </div>

            <div class="form-group">
                <label>與新人關係 RELATIONSHIP</label>
                <select class="form-control" name="entry.112233445">
                    <option value="男方家人親戚">男方家人親戚</option>
                    <option value="男方好友">男方好友</option>
                    <option value="男方同事">男方同事</option>
                    <option value="女方家人親戚">女方家人親戚</option>
                    <option value="女方好友">女方好友</option>
                    <option value="女方同事">女方同事</option>
                </select>
            </div>

            <div class="form-group">
                <label>參加人數 GUESTS</label>
                <input type="number" class="form-control" name="entry.556677889" min="0" value="1" required>
            </div>

            <div class="form-group">
                <label>飲食需求 DIETARY</label>
                <select class="form-control" name="entry.998877665">
                    <option value="葷食">葷食</option>
                    <option value="素食">素食</option>
                </select>
            </div>

            <div class="form-group">
                <label>給新人的祝福 BLESSINGS</label>
                <textarea class="form-control" name="entry.443322110" rows="3" placeholder="想對新人說的話..."></textarea>
            </div>

            <button type="submit" class="submit-btn">確認送出 RSVP</button>
        </form>
    </section>

    <!-- 倒數計時器 Script -->
    <script>
        var submitted = false;
        const weddingDate = new Date("2027-01-31T12:00:00").getTime();

        const timer = setInterval(() => {
            const now = new Date().getTime();
            const diff = weddingDate - now;

            if (diff < 0) {
                clearInterval(timer);
                return;
            }

            document.getElementById("days").innerText = Math.floor(diff / (1000 * 60 * 60 * 24));
            document.getElementById("hours").innerText = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            document.getElementById("minutes").innerText = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            document.getElementById("seconds").innerText = Math.floor((diff % (1000 * 60)) / 1000);
        }, 1000);
    </script>
</body>
</html>
